schema_version: 1
name: ibm_bid_project_fields
description: Field schema corresponding to the legacy markdown checklist. Canonical state lives in SQLite; these fields inform dashboard rendering, migration, and profile-specific summaries.
canonical_state: ./tmp/ibm-bid-project.sqlite
generated_dashboard: ./tmp/ibm-bid-project.md
legacy_template: $SKILL_DIR/references/legacy-ibm-bid-project-template.md
fields:
  - name: tender_name
    group: project
    value_type: text
    maps_to: project.name
  - name: tender_value
    group: project
    value_type: text
    maps_to: project.metadata_json.tender_value
  - name: client
    group: project
    value_type: text
    maps_to: project.metadata_json.client
  - name: tender_type
    group: project
    value_type: text
    maps_to: project.metadata_json.tender_type
  - name: submission_deadline
    group: project
    value_type: datetime
    maps_to: project.metadata_json.submission_deadline
  - name: source_documents
    group: sources
    value_type: list
    maps_to: source_asset
  - name: current_phase
    group: workflow
    value_type: enum
    maps_to: work_item.phase
    values:
      - opportunity_assessment
      - strategic_positioning
      - solution_architecture
      - content_development
      - technical_assurance
  - name: routing_tag
    group: orchestration
    value_type: enum
    maps_to: work_item.tag
    description: Optional single tag used by claim-next to route work to specialist bid agents. Use the skill identifier for specialist work where possible.
    values:
      - ibm-bid-answer-evaluator
      - ibm-bid-autorfp-packager
      - ibm-bid-clarifications
      - ibm-bid-client-language-analysis
      - ibm-bid-competitor-analysis
      - ibm-bid-customer-stories
      - ibm-bid-executive-summary
      - ibm-bid-fact-checker
      - ibm-bid-hot-buttons
      - ibm-bid-image-definer
      - ibm-bid-legal-assessment
      - ibm-bid-library
      - ibm-bid-navigator
      - ibm-bid-offerings-advisor
      - ibm-bid-pricing-strategy
      - ibm-bid-qualification
      - ibm-bid-requirements-analysis
      - ibm-bid-requirements-extractor
      - ibm-bid-scope-constrainer
      - ibm-bid-social-value-expert
      - ibm-bid-solution-architect
      - ibm-bid-solution-overview
      - ibm-bid-staffing-planner
      - ibm-bid-strategic-positioning
      - ibm-bid-strategy-and-capabilities-2026
      - ibm-bid-tda-review
      - ibm-bid-win-themes
      - ibm-bid-wireframe-creator
      - ibm-bid-word-count
      - ibm-bid-writer
      - ibm-sf-ams
      - ibm-sf-architect
      - ibm-sf-help
      - ibm-sf-org-discovery
      - ibm-sf-solution-architect
  - name: requirements_analysis_status
    group: workflow_status
    value_type: status
    maps_to: work_item.status
    work_item_key: requirements_analysis
  - name: requirements_analysis_artifact
    group: artifacts
    value_type: path
    maps_to: artifact.path
    artifact_key: requirements_analysis
  - name: qualification_status
    group: workflow_status
    value_type: status
    maps_to: work_item.status
    work_item_key: qualification
  - name: qualification_artifact
    group: artifacts
    value_type: path
    maps_to: artifact.path
    artifact_key: qualification
  - name: qualification_score
    group: decisions
    value_type: number
    maps_to: work_item.metadata.qualification_score
  - name: qualification_recommendation
    group: decisions
    value_type: enum
    maps_to: work_item.metadata.qualification_recommendation
    values:
      - strong_go
      - proceed_with_caution
      - mitigation_required
      - recommend_no_bid
  - name: strategic_positioning_status
    group: workflow_status
    value_type: status
    maps_to: work_item.status
    work_item_key: strategic_positioning
  - name: strategic_positioning_artifact
    group: artifacts
    value_type: path
    maps_to: artifact.path
    artifact_key: strategic_positioning
  - name: strategic_recommendations
    group: decisions
    value_type: list
    maps_to: work_item.metadata.strategic_recommendations
  - name: competitor_analysis_status
    group: workflow_status
    value_type: status
    maps_to: work_item.status
    work_item_key: competitor_analysis
  - name: competitor_analysis_artifact
    group: artifacts
    value_type: path
    maps_to: artifact.path
    artifact_key: competitor_analysis
  - name: competitor_priority_threats
    group: strategy
    value_type: list
    maps_to: work_item.metadata.competitor_priority_threats
  - name: competitor_hypotheses
    group: strategy
    value_type: list
    maps_to: work_item.metadata.competitor_hypotheses
  - name: clarifications_status
    group: workflow_status
    value_type: status
    maps_to: work_item.status
    work_item_key: clarifications
  - name: clarifications_artifact
    group: artifacts
    value_type: path
    maps_to: artifact.path
    artifact_key: clarifications
  - name: clarification_questions_count
