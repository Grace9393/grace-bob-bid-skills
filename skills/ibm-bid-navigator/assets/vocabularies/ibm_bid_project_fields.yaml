  - name: legal_assessment_status
    group: workflow_status
    value_type: status
    maps_to: work_item.status
    work_item_key: legal_assessment
  - name: legal_assessment_artifact
    group: artifacts
    value_type: path
    maps_to: artifact.path
    artifact_key: legal_assessment
  - name: legal_risk_rating
    group: risks
    value_type: enum
    maps_to: work_item.metadata.legal_risk_rating
