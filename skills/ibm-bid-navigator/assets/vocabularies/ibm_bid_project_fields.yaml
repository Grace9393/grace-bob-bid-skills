  - name: hot_buttons_status
    group: workflow_status
    value_type: status
    maps_to: work_item.status
    work_item_key: hot_buttons
  - name: hot_buttons_artifact
    group: artifacts
    value_type: path
    maps_to: artifact.path
    artifact_key: hot_buttons
  - name: key_client_priorities
    group: strategy
    value_type: list
    maps_to: work_item.metadata.key_client_priorities
  - name: win_themes_status
    group: workflow_status
    value_type: status
    maps_to: work_item.status
    work_item_key: win_themes
  - name: win_themes_artifact
    group: artifacts
    value_type: path
    maps_to: artifact.path
